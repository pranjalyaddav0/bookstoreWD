
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Engineering BookStore</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <header>
        <h2>Engineering BookStore</h2>
        <nav>
            <a href="index.html">Login</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">My Cart</a>
        </nav>
    </header>

    <main class="container">
        <h1>My Shopping Cart</h1>

        <div id="cart-items"></div>

        <div class="total-box">
            <h3>Total Amount: ₹<span id="total">0</span></h3>
            <button onclick="checkout()">Proceed to Checkout</button>
        </div>
    </main>

    <script>
        // Read cart items saved by the catalogue page
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function displayCart() {
            const cartItems = document.getElementById("cart-items");
            const totalElement = document.getElementById("total");

            cartItems.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                cartItems.innerHTML = "<p>Your cart is empty.</p>";
                totalElement.textContent = "0";
                return;
            }

            cart.forEach((book, index) => {
                const name = book.title || book.name || "Book";
                const price = Number(book.price) || 0;

                total += price;

                cartItems.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <h3>${name}</h3>
                            <p>Price: ₹${price}</p>
                        </div>
                        <button onclick="removeBook(${index})">
                            Remove
                        </button>
                    </div>
                `;
            });

            totalElement.textContent = total;
        }

        function removeBook(index) {
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            alert("Checkout page will be connected next.");
        }

        displayCart();
    </script>

</body>
</html>
